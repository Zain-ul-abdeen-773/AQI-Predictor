name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'

env:
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION || '3.11' }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linters
        run: pip install ruff

      - name: Run Ruff (lint + format check)
        run: |
          ruff check . --output-format=github
          ruff format --check .

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import smoke test
        run: |
          python -c "from config.settings import get_settings; print('Settings OK')"
          python -c "from training_pipeline.registry import ModelRegistryManager; print('Registry OK')"
          python -c "from deployment.api.main import app; print('Flask app OK')"
        env:
          PYTHONPATH: .

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short --cov=. --cov-report=term-missing --cov-report=xml
        env:
          PYTHONPATH: .
          AQICN_API_KEY: demo

  api-contract:
    name: API Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test all API endpoints
        run: python -m pytest tests/test_api.py -v --tb=short
        env:
          PYTHONPATH: .
          AQICN_API_KEY: demo

  typecheck-frontend:
    name: TypeScript & Build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: api-contract

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: deployment/web_app/package-lock.json

      - name: Install dependencies
        working-directory: deployment/web_app
        run: npm ci

      - name: TypeScript check
        working-directory: deployment/web_app
        run: npx tsc --noEmit

      - name: Next.js build
        working-directory: deployment/web_app
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://pearls-aqi-api.onrender.com

      - name: Run frontend tests
        working-directory: deployment/web_app
        run: npx vitest run

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'

env:
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION || '3.11' }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linters
        run: pip install ruff

      - name: Run Ruff (lint + format check)
        run: |
          ruff check . --output-format=github
          ruff format --check .
        continue-on-error: true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short -x
        env:
          PYTHONPATH: .
          AQICN_API_KEY: demo
        continue-on-error: true

      - name: Import smoke test
        run: |
          python -c "from config.settings import get_settings; print('Settings OK')"
          python -c "from training_pipeline.registry import ModelRegistryManager; print('Registry OK')"
          python -c "from deployment.api.main import app; print('Flask app OK')"
        env:
          PYTHONPATH: .

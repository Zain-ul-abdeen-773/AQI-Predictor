name: Feature Pipeline (Hourly)

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:

env:
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION || '3.11' }}

jobs:
  ingest-features:
    name: Ingest & Push Features
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run feature ingestion
        run: python -m data_pipeline.ingest
        env:
          PYTHONPATH: .
          AQICN_API_KEY: ${{ secrets.AQICN_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}

      - name: Push to ClearML Feature Store
        run: |
          python -c "
          from feature_pipeline.register import FeatureStoreManager
          from data_pipeline.ingest import DataIngestionOrchestrator
          from data_pipeline.transformers import FeatureEngineer
          import asyncio

          async def run():
              orchestrator = DataIngestionOrchestrator()
              payload = await orchestrator.fetch_current()
              await orchestrator.close()

              engineer = FeatureEngineer()
              fv = engineer.transform(payload)

              import pandas as pd
              df = pd.DataFrame([fv.to_flat_dict()])

              manager = FeatureStoreManager()
              manager.insert_features(df)
              print(f'Pushed {len(df)} rows to ClearML feature store')

          asyncio.run(run())
          "
        env:
          PYTHONPATH: .
          AQICN_API_KEY: ${{ secrets.AQICN_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          CLEARML_API_ACCESS_KEY: ${{ secrets.CLEARML_API_ACCESS_KEY }}
          CLEARML_API_SECRET_KEY: ${{ secrets.CLEARML_API_SECRET_KEY }}

      - name: Run data pipeline tests
        run: python -m pytest tests/test_data_pipeline.py -v --tb=short
        env:
          PYTHONPATH: .
        continue-on-error: true

      - name: Report status
        if: always()
        run: |
          echo "Feature pipeline completed at $(date -u)"
          echo "Status: ${{ job.status }}"

name: Keep Alive (Render)

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:

jobs:
  ping:
    name: Ping API
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Keep Render awake
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pearls-aqi-api.onrender.com/health" || echo "000")
          echo "Health check: HTTP $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "API is awake and healthy"
          else
            echo "API returned $STATUS (may be waking up)"
          fi

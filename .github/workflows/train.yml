name: Training Pipeline (Daily)

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:

env:
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION || '3.11' }}

jobs:
  train:
    name: Train & Register All Models
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract training data from ClearML
        run: |
          python -c "
          from feature_pipeline.register import FeatureStoreManager
          from pathlib import Path
          manager = FeatureStoreManager()
          df = manager.get_training_data()
          print(f'Retrieved {len(df)} training samples')
          Path('data').mkdir(exist_ok=True)
          df.to_csv('data/training_data.csv', index=False)
          "
        env:
          PYTHONPATH: .
          CLEARML_API_ACCESS_KEY: ${{ secrets.CLEARML_API_ACCESS_KEY }}
          CLEARML_API_SECRET_KEY: ${{ secrets.CLEARML_API_SECRET_KEY }}

      - name: Run full training pipeline (all 9 models)
        run: python -m training_pipeline.train --csv data/training_data.csv
        env:
          PYTHONPATH: .
          OPTUNA_N_TRIALS: 20
          CLEARML_API_ACCESS_KEY: ${{ secrets.CLEARML_API_ACCESS_KEY }}
          CLEARML_API_SECRET_KEY: ${{ secrets.CLEARML_API_SECRET_KEY }}

      - name: Print training summary
        run: |
          python -c "
          import json
          from pathlib import Path

          report = Path('models/training_report.json')
          if report.exists():
              data = json.loads(report.read_text())
              champion = data.get('champion', 'unknown')
              metrics = data.get('metrics', {})

              print(f'Champion: {champion}')
              for name, m in metrics.items():
                  print(f'  {name}: RMSE={m.get(\"rmse\", \"N/A\")}, R²={m.get(\"r2\", \"N/A\")}')
          else:
              print('No training report found')

          manifest = Path('models/model_registry.json')
          if manifest.exists():
              data = json.loads(manifest.read_text())
              print(f'\\nRegistered {len(data.get(\"models\", {}))} models in manifest')
          "
        env:
          PYTHONPATH: .

      - name: Upload training artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-artifacts
          path: |
            models/training_report.json
            models/model_registry.json
          retention-days: 30

      - name: Run model tests
        run: python -m pytest tests/test_training_pipeline.py -v --tb=short
        env:
          PYTHONPATH: .
        continue-on-error: true

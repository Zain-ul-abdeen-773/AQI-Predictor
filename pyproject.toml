[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pearls-aqi-predictor"
version = "1.0.0"
description = "End-to-end AQI prediction system for Sargodha, Pakistan"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Pearls Engineering Team"},
]
keywords = ["aqi", "air-quality", "machine-learning", "forecasting", "lstm", "lightgbm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=. --cov-report=term-missing --cov-report=xml:coverage.xml --cov-config=pyproject.toml"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:clearml.*",
    "ignore::DeprecationWarning:pyparsing.*",
    "ignore::UserWarning:sklearn.*",
    "ignore::UserWarning:lightgbm.*",
]

[tool.coverage.run]
source = ["config", "data_pipeline", "feature_pipeline", "training_pipeline", "deployment"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/eda/*",
    "deployment/web_app/*",
    "deployment/streamlit_app/*",
    "rewrite.py",
    "shrink_pairs.py",
    "fix_*.py",
    "**/export_onnx.py",
    "**/grad_cam.py",
    "**/historical.py",
    "**/deep_learning.py",
    "**/callbacks.py",
    "**/backfill.py",
    "**/ingest.py",
    "**/transformers.py",
    "**/explainability.py",
]

[tool.coverage.report]
fail_under = 45
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N803", "N806", "UP042", "W293", "F841", "E731"]

[tool.ruff.lint.isort]
known-first-party = ["config", "data_pipeline", "feature_pipeline", "training_pipeline", "deployment", "infrastructure"]
